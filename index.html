          <p style="margin-top:10px;font-size:17px;color:var(--rm-mut,#c9b8cc)">Regnskap og bilag</p>
          <div style="margin-top:26px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px;"><div style="padding:13px 0;"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Kontoplan og saldoer</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Grunnlaget for balansekontroll og avstemminger.</p></div><div style="padding:13px 0;"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Posteringer og bilagslinjer</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Hver eneste transaksjon i regnskapsåret.</p></div><div style="padding:13px 0;"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Bilag med vedlegg</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Fakturaen hentes med, så revisor slipper å laste den opp.</p></div><div style="padding:13px 0;"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">MVA-koder</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Hver linje kontrolleres mot Skatteetatens kodeverk.</p></div><div style="padding:13px 0;"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Leverandører</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Organisasjonsnummer kontrolleres mot Enhetsregisteret.</p></div><div style="padding:13px 0;"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Valuta og originalbeløp</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Utenlandske fakturaer avstemmes i sin egen valuta.</p></div></div>

        <p style="margin-top:10px;font-size:16px;color:var(--rm-mut,#c9b8cc)">Skatteoppgjør, skattemelding, krav og betalinger</p>
        <div style="margin-top:28px;">
          <div style="padding:13px 0;"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Skatteoppgjør mot skattemelding</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Avstemmer skattemessig resultat, underskudd til fremføring og skattemessig formuesverdi av aksjene.</p></div>
          <div style="padding:13px 0;"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Alle kundene med ett trykk</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Skattemelding og skatteoppgjør hentes for alle kundene samtidig. Rapporten lastes ned som Excel, med én linje per kunde.</p></div>
          <div style="padding:13px 0"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Kunden godkjenner ingenting</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Motoren henter med revisjonsforetakets egen tilgang. Kunden blir aldri bedt om å godkjenne noe.</p></div>

        <p style="margin-top:10px;font-size:16px;color:var(--rm-mut,#c9b8cc)">Skatteoppgjøret som dokument</p>
        <div style="margin-top:28px;">
          <div style="padding:13px 0;"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Dokumentet mot tallene</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Skatteoppgjøret hentes som dokument, og tallene i dokumentet sammenlignes med tallene fra Skatteetaten.</p></div>
          <div style="padding:13px 0"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Tilgangene i Altinn</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Krever at revisjonsforetaket har gitt tilgangene i Altinn. Ellers kan dokumentene lastes opp, og da leses tallene fra dokumentene.</p></div>
        </div>

        <h3 style="margin-top:36px;font:500 clamp(28px,2.6vw,36px)/1 'Barlow',system-ui,sans-serif;letter-spacing:-.02em;color:var(--rm-ink,#f3ecf4)">Tripletex</h3>
        <p style="margin-top:10px;font-size:16px;color:var(--rm-mut,#c9b8cc)">Regnskap og bilag</p>
        <div style="margin-top:28px;">
          <div style="padding:13px 0;"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Kontoplan og saldoer</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Grunnlaget for balansekontroll og avstemminger.</p></div>
          <div style="padding:13px 0;"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Posteringer og bilagslinjer</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Hver eneste transaksjon i regnskapsåret.</p></div>
          <div style="padding:13px 0;"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Bilag med vedlegg</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Fakturaen hentes med, så revisor slipper å laste den opp.</p></div>
          <div style="padding:13px 0;"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">MVA-koder</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Hver linje kontrolleres mot Skatteetatens kodeverk.</p></div>
          <div style="padding:13px 0;"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Leverandører</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Organisasjonsnummer kontrolleres mot Enhetsregisteret.</p></div>
          <div style="padding:13px 0"><p style="font:500 16px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Valuta og originalbeløp</p><p style="margin-top:3px;font-size:15px;line-height:1.45;color:var(--rm-mut2,#a993ad)">Utenlandske fakturaer avstemmes i sin egen valuta.</p></div>
        </div>
        <div style="margin-top:auto;padding-top:28px">
          <div style="padding:16px 18px;background:var(--rm-bg,#1b0c1d);border-radius:2px">
            <p style="font:500 15px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Nøkkelen tilhører revisjonsforetaket</p>
            <p style="margin-top:6px;font-size:15px;line-height:1.5;color:var(--rm-mut,#c9b8cc)">Den kan trekkes tilbake i Tripletex når som helst, uten å gå veien om oss. Ingenting skrives tilbake til regnskapet.</p>
          </div>
          <a href="tripletex.html" style="margin-top:20px;display:inline-flex;align-items:center;gap:8px;color:var(--rm-acc,#d3c0d5);font:500 15px/1 'Barlow',system-ui,sans-serif;text-decoration:none" style-hover="color:var(--rm-hi,#ffffff)">Om koblingen<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg></a>

<section id="prinsipp" data-screen-label="07 Prinsippet" style="position:relative;overflow:hidden;background:var(--rm-bg,#1b0c1d);padding:0 0 clamp(96px,10vw,152px)">
  <div aria-hidden="true" style="position:absolute;left:50%;top:62%;width:min(1000px,120vw);height:700px;transform:translate(-50%,-50%);background:var(--rm-glowbg,radial-gradient(closest-side,rgba(109,46,114,.38),rgba(109,46,114,0)));pointer-events:none"></div>
  <div style="max-width:1280px;margin:0 auto;padding:0 clamp(20px,4vw,40px)">
    <div style="padding-top:clamp(72px,8vw,120px);display:flex;flex-wrap:wrap;gap:48px 80px">
      <div style="flex:6 1 480px;min-width:0">
        <h2 style="font:500 clamp(40px,5vw,80px)/1 'Barlow',system-ui,sans-serif;letter-spacing:-.03em;color:var(--rm-ink,#f3ecf4);text-wrap:balance">
          <span style="display:block">Lesetjenesten leser.</span>
          <span style="display:block"><span style="font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--rm-ital,#e6d3ea);background:var(--rm-tg,none);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:var(--rm-tgf,currentColor)">Koden kontrollerer.</span></span>
        </h2>
      </div>
      <div style="flex:5 1 360px;min-width:0;align-self:flex-end">
        <p style="font-size:17px;line-height:1.6;color:var(--rm-ink,#f3ecf4);text-wrap:pretty">Lesetjenesten brukes bare til å lese: å forstå et ustrukturert dokument og hente ut tallene som står der. Selve kontrollen gjøres i kode. Datoer, beløp, summer og sammenligninger regnes ut av regler som gir samme svar hver gang.</p>
        <ul style="list-style:none;margin-top:32px;border-top:2px solid var(--rm-ink,#f3ecf4)">
          <li style="display:flex;align-items:baseline;gap:16px;padding:16px 0;"><span style="flex:none;width:12px;height:12px;background:var(--rm-ok,#d3c0d5)"></span><span style="flex:0 0 200px;font:500 18px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Stemmer</span><span style="flex:1 1 auto;font-size:16px;color:var(--rm-mut,#c9b8cc)">Bekreftet mot kilde.</span></li>
          <li style="display:flex;align-items:baseline;gap:16px;padding:16px 0;"><span style="flex:none;width:12px;height:12px;border:1.5px solid var(--rm-chk,#d3c0d5)"></span><span style="flex:0 0 200px;font:500 18px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Kontroller</span><span style="flex:1 1 auto;font-size:16px;color:var(--rm-mut,#c9b8cc)">Avviket går til revisor med grunnen.</span></li>
          <li style="display:flex;align-items:baseline;gap:16px;padding:16px 0;"><span style="flex:none;width:12px;height:12px;border:1.5px dashed var(--rm-miss,#a993ad)"></span><span style="flex:0 0 200px;font:500 18px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-ink,#f3ecf4)">Mangler dokumentasjon</span><span style="flex:1 1 auto;font-size:16px;color:var(--rm-mut,#c9b8cc)">Telles som ukontrollert, aldri som godkjent.</span></li>
        </ul>
      </div>
    </div>
  </div>
</section>

<section id="vesentlighet" data-screen-label="08 Vesentlighet" style="background:var(--rm-lbg,#f6f5f8);color:var(--rm-link,#1f1b26);padding:clamp(96px,10vw,152px) 0">
  <div style="max-width:1280px;margin:0 auto;padding:0 clamp(20px,4vw,40px)">
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px 80px">
      <h2 style="flex:5 1 320px;min-width:0;max-width:13ch;font:500 clamp(36px,4vw,60px)/1.04 'Barlow',system-ui,sans-serif;letter-spacing:-.025em;color:var(--rm-link,#1f1b26);text-wrap:balance">Revisor ser alle avvik, også de små</h2>
      <p style="flex:7 1 480px;min-width:0;max-width:58ch;font-size:clamp(17px,1.3vw,19px);line-height:1.55;color:var(--rm-link,#1f1b26);text-wrap:pretty">Motoren beregner vesentlighetsgrensen ut fra selskapets egne tall (driftsinntekter, årsoverskudd, eiendeler og egenkapital), og avleder arbeidsvesentlighet og en grense for ubetydelige feil av den. Grensene vises for hver revisjon, men brukes ikke til å godkjenne noe ennå.</p>
    </div>
    <div style="margin-top:clamp(48px,5vw,72px);background:var(--rm-bg,#f6f5f8);border-radius:2px;padding:clamp(20px,3vw,40px)">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 24px">
        <p style="font:500 17px/1.3 'Barlow',system-ui,sans-serif;color:var(--rm-link,#1f1b26)">Dra grensen og se hvor avvikene ligger</p>
        <p style="font-size:14px;color:var(--rm-lmut2,#67616f)">Illustrasjon med tilfeldige avvik, ikke ekte data</p>
      </div>
      <div ref="{{ vesWrap }}" role="slider" tabindex="0" aria-label="Grense for ubetydelige feil" aria-valuemin="4" aria-valuemax="96" aria-valuenow="64" style="position:relative;margin-top:28px;cursor:ew-resize;touch-action:none;outline-offset:8px">
        <canvas ref="{{ vesCanvas }}" style="width:100%;height:240px"></canvas>
      </div>
      <div style="margin-top:28px;padding-top:24px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px 64px">
        <div style="flex:1 1 200px;min-width:0"><span ref="{{ vesOk }}" style="display:block;font:500 clamp(44px,5vw,72px)/.9 'Barlow',system-ui,sans-serif;letter-spacing:-.03em;color:#857a8f;font-variant-numeric:tabular-nums">0</span><span style="display:block;margin-top:12px;font-size:16px;color:var(--rm-lmut,#56505f)">under grensen for ubetydelige feil</span></div>
        <div style="flex:1 1 200px;min-width:0"><span ref="{{ vesRev }}" style="display:block;font:500 clamp(44px,5vw,72px)/.9 'Barlow',system-ui,sans-serif;letter-spacing:-.03em;color:var(--rm-brand,#6d2e72);font-variant-numeric:tabular-nums">0</span><span style="display:block;margin-top:12px;font-size:16px;color:var(--rm-lmut,#56505f)">over grensen</span></div>
        <p style="flex:2 1 320px;min-width:0;font-size:15px;line-height:1.5;color:var(--rm-lmut,#56505f);text-wrap:pretty">Inntil videre godkjenner ingen kontroll et avvik fordi det er lite. Alt over øreavrundingen går til revisor, med grunnen. Grensene stilles inn per revisjonsforetak.</p>
      </div>
    </div>
  </div>
</section>

<section id="trygghet" data-screen-label="09 Trygghet" style="position:relative;overflow:hidden;background:var(--rm-bg,#1b0c1d);padding:clamp(112px,12vw,176px) 0 clamp(96px,10vw,152px)">
  <div aria-hidden="true" style="position:absolute;left:50%;top:300px;width:min(1200px,130vw);height:820px;transform:translate(-50%,-50%);background:var(--rm-glowbg,radial-gradient(closest-side,rgba(109,46,114,.38),rgba(109,46,114,0)));pointer-events:none"></div>
  <div style="position:relative;max-width:1280px;margin:0 auto;padding:0 clamp(20px,4vw,40px)">
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
      
      <h2 style="max-width:16ch;font:500 clamp(40px,5vw,76px)/1.04 'Barlow',system-ui,sans-serif;letter-spacing:-.03em;color:var(--rm-ink,#f3ecf4);text-wrap:balance">Bygget for tilliten <span style="font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--rm-ital,#e6d3ea);background:var(--rm-tg,none);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:var(--rm-tgf,currentColor)">revisjon krever</span></h2>
    </div>
    <div style="margin-top:clamp(64px,7vw,104px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:56px 40px">
      <div style="min-width:0"><h3 style="font:500 clamp(24px,2.2vw,30px)/1.15 'Barlow',system-ui,sans-serif;letter-spacing:-.01em;color:var(--rm-ink,#f3ecf4)">Data i Norge</h3><p style="margin-top:14px;max-width:36ch;font-size:16px;line-height:1.55;color:var(--rm-ink,#f3ecf4);text-wrap:pretty">Databasen ligger i Microsoft Azure sin norske region. Regnskapsdata forlater ikke EØS, heller ikke når dokumenter leses maskinelt.</p></div>
      <div style="min-width:0"><h3 style="font:500 clamp(24px,2.2vw,30px)/1.15 'Barlow',system-ui,sans-serif;letter-spacing:-.01em;color:var(--rm-ink,#f3ecf4)">Hvert foretak for seg</h3><p style="margin-top:14px;max-width:36ch;font-size:16px;line-height:1.55;color:var(--rm-ink,#f3ecf4);text-wrap:pretty">Hver bruker ser bare kundene som er tildelt, og hvem som har sett hvilken kunde, logges. Innlogging med Microsoft-konto.</p></div>
      <div style="min-width:0"><h3 style="font:500 clamp(24px,2.2vw,30px)/1.15 'Barlow',system-ui,sans-serif;letter-spacing:-.01em;color:var(--rm-ink,#f3ecf4)">Kryptert</h3><p style="margin-top:14px;max-width:36ch;font-size:16px;line-height:1.55;color:var(--rm-ink,#f3ecf4);text-wrap:pretty">Data krypteres i transport og i hvile. Nøklene til regnskapssystemene lagres kryptert.</p></div>
      <div style="min-width:0"><h3 style="font:500 clamp(24px,2.2vw,30px)/1.15 'Barlow',system-ui,sans-serif;letter-spacing:-.01em;color:var(--rm-ink,#f3ecf4)">Fullt revisjonsspor</h3><p style="margin-top:14px;max-width:36ch;font-size:16px;line-height:1.55;color:var(--rm-ink,#f3ecf4);text-wrap:pretty">Hver kontroll logges med regel, kilde og beløp. Revisors vurderinger står når kontrollene kjøres på nytt.</p></div>
      <div style="min-width:0"><h3 style="font:500 clamp(24px,2.2vw,30px)/1.15 'Barlow',system-ui,sans-serif;letter-spacing:-.01em;color:var(--rm-ink,#f3ecf4)">Sletting etter fem år</h3><p style="margin-top:14px;max-width:36ch;font-size:16px;line-height:1.55;color:var(--rm-ink,#f3ecf4);text-wrap:pretty">Fristen løper fra datoen revisjonsberetningen ble avlagt, når datoen er registrert. Hver sletting kvitteres i en logg.</p></div>
      <div style="min-width:0"><h3 style="font:500 clamp(24px,2.2vw,30px)/1.15 'Barlow',system-ui,sans-serif;letter-spacing:-.01em;color:var(--rm-ink,#f3ecf4)">Grønt betyr kontrollert</h3><p style="margin-top:14px;max-width:36ch;font-size:16px;line-height:1.55;color:var(--rm-ink,#f3ecf4);text-wrap:pretty">Det som ikke kan bekreftes, merkes til gjennomgang. Programmet gjetter aldri.</p></div>
    </div>
    <div style="margin-top:clamp(56px,6vw,88px);display:flex;justify-content:center"><a href="systemsikkerhet.html" style="display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 24px;border-radius:8px;background:var(--rm-panel,#211023);color:var(--rm-ink,#f3ecf4);font:600 16px/1 'Barlow',system-ui,sans-serif;text-decoration:none;transition:background-color 200ms ease" style-hover="background:rgba(var(--rm-lrgb,243,236,244),.06);color:var(--rm-hi,#ffffff)">Les mer om systemsikkerhet<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg></a></div>
  </div>
</section>
